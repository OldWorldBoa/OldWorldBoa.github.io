[package]
name = "server"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
unix-time = "0.1.5"
turso = "0.4.3"
serde = { version="1.0.130", features=["derive"] }
rocket = { version="0.5.1", features=["json"] }
tokio = { version = "1.0", features = ["full"] }
libsql = "0.9.30"
serde_json = "1.0"
